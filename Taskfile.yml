# https://taskfile.dev
version: "3"

vars:
  FIXTURE: tests/fixtures/chatgpt/branching-conversation.json

tasks:
  default:
    desc: List available Mindcap tasks.
    cmds:
      - task --list
    silent: false

  # ── Setup and dependency management ────────────────────────────────────────

  setup:
    desc: Install all dependencies and prepare the local development environment.
    cmds:
      - poetry install
      - poetry run playwright install chromium
    silent: false

  install:
    desc: Install project dependencies using the Poetry lock file.
    cmds:
      - poetry install
    silent: false

  lock:
    desc: Regenerate the Poetry lock file from pyproject.toml.
    cmds:
      - poetry lock
    silent: false

  # ── Quality gates ──────────────────────────────────────────────────────────

  format:
    desc: Apply Ruff formatter and safe automatic lint fixes.
    cmds:
      - poetry run ruff format .
      - poetry run ruff check --fix .
    silent: false

  lint:
    desc: Check code style with Ruff (linting and format check).
    cmds:
      - poetry run ruff check .
      - poetry run ruff format --check .
    silent: false

  typecheck:
    desc: Run strict MyPy type checks for source and test paths.
    cmds:
      - poetry run mypy src tests
    silent: false

  test:
    desc: Run the complete automated test suite.
    cmds:
      - poetry run pytest
    silent: false

  test:unit:
    desc: Run unit tests only.
    cmds:
      - poetry run pytest tests/ --ignore=tests/architecture --ignore=tests/integration -q
    silent: false

  test:architecture:
    desc: Run architecture boundary tests.
    cmds:
      - poetry run pytest tests/architecture/ -v
    silent: false

  check:
    desc: >-
      Run all quality gates (format check, lint, type check, tests).
      Stops immediately if any gate fails.
    cmds:
      - task: lint
      - task: typecheck
      - task: test
    silent: false

  # ── Build and publication ──────────────────────────────────────────────────

  build:
    desc: Build the wheel and source distribution.
    cmds:
      - poetry build
    silent: false

  publish:check:
    desc: Validate package metadata and build artifacts before publishing.
    cmds:
      - poetry check
      - poetry build
    silent: false

  # ── Smoke test ─────────────────────────────────────────────────────────────

  smoke:
    desc: >-
      Run the offline fixture through the full saved-JSON pipeline and verify
      the bundle. Requires no authentication or network access.
    vars:
      SMOKE_DIR:
        sh: mktemp -d
    cmds:
      - >-
        poetry run mindcap import chatgpt
        "{{.FIXTURE}}"
        --output "{{.SMOKE_DIR}}"
      - |
        BUNDLE=$(ls -d "{{.SMOKE_DIR}}"/conversations/chatgpt/*/v1 2>/dev/null | head -1)
        if [ -z "$BUNDLE" ]; then
          printf 'Smoke test failed: no bundle directory was created under %s\n' "{{.SMOKE_DIR}}"
          rm -rf "{{.SMOKE_DIR}}"
          exit 1
        fi
        poetry run mindcap verify "$BUNDLE"
        rm -rf "{{.SMOKE_DIR}}"
    silent: false

  # ── Developer convenience ──────────────────────────────────────────────────

  paths:
    desc: Display the archive location and dedicated authentication-profile location.
    cmds:
      - poetry run mindcap paths
    silent: false

  doctor:
    desc: Run safe browser diagnostics for the ChatGPT capture profile.
    cmds:
      - poetry run mindcap doctor chatgpt
    silent: false

  version:
    desc: Print the installed Mindcap version.
    cmds:
      - poetry run mindcap --version
    silent: false

  auth:
    desc: >-
      Authenticate the dedicated ChatGPT browser profile using stable Google
      Chrome. Opens Chrome directly — complete login manually, then press Enter.
    cmds:
      - poetry run mindcap auth chatgpt
    silent: false

  capture:
    desc: >-
      Capture a ChatGPT conversation via the browser strategy.
      Usage: task capture -- "<url-or-uuid>"
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "Usage: task capture -- \"<url-or-uuid>\""
          echo "Example: task capture -- \"https://chatgpt.com/c/6a14b69f-7834-83ea-8257-0eceadb41691\""
          exit 1
        fi
        poetry run mindcap capture chatgpt "{{.CLI_ARGS}}" --strategy "browser"
    silent: false

  import:
    desc: >-
      Import a previously saved ChatGPT JSON payload.
      Usage: task import -- "<path/to/file.json>"
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "Usage: task import -- \"<path/to/file.json>\""
          echo "Example: task import -- \"tests/fixtures/chatgpt/branching-conversation.json\""
          exit 1
        fi
        poetry run mindcap import chatgpt "{{.CLI_ARGS}}"
    silent: false

  verify:
    desc: >-
      Verify the integrity of a captured archive bundle.
      Usage: task verify -- "<bundle-path>"
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "Usage: task verify -- \"<bundle-path>\""
          echo "Tip:   run 'task paths' to locate your archive directory."
          exit 1
        fi
        poetry run mindcap verify "{{.CLI_ARGS}}"
    silent: false

  smoke:
    desc: >-
      Run the offline fixture through the full saved-JSON pipeline and verify
      the bundle. Requires no authentication or network access.
    vars:
      SMOKE_DIR:
        sh: mktemp -d
    cmds:
      - >-
        poetry run mindcap import chatgpt
        "{{.FIXTURE}}"
        --output "{{.SMOKE_DIR}}"
      - |
        BUNDLE=$(ls -d "{{.SMOKE_DIR}}"/conversations/chatgpt/*/v1 2>/dev/null | head -1)
        if [ -z "$BUNDLE" ]; then
          echo "Smoke test failed: no bundle directory was created under {{.SMOKE_DIR}}"
          rm -rf "{{.SMOKE_DIR}}"
          exit 1
        fi
        poetry run mindcap verify "$BUNDLE"
        rm -rf "{{.SMOKE_DIR}}"
    silent: false

  test:
    desc: Run the complete automated test suite.
    cmds:
      - poetry run pytest
    silent: false

  lint:
    desc: Check code style with Ruff (linting and format check).
    cmds:
      - poetry run ruff check .
      - poetry run ruff format --check .
    silent: false

  format:
    desc: Apply Ruff formatter and safe automatic lint fixes.
    cmds:
      - poetry run ruff format .
      - poetry run ruff check --fix .
    silent: false

  typecheck:
    desc: Run strict MyPy type checks for source and test paths.
    cmds:
      - poetry run mypy src tests
    silent: false

  check:
    desc: >-
      Run all quality gates (format check, lint, type check, tests).
      Stops immediately if any gate fails.
    cmds:
      - task: lint
      - task: typecheck
      - task: test
    silent: false

  clean:
    desc: >-
      Remove disposable developer artifacts (.pytest_cache, .ruff_cache,
      .mypy_cache, bytecode caches, coverage output). Never removes archives
      or authentication state.
    cmds:
      - rm -rf .pytest_cache .ruff_cache .mypy_cache htmlcov .coverage
      - find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
      - find . -type f -name "*.pyc" -delete 2>/dev/null || true
    silent: false

  # ── Suno-specific tasks ─────────────────────────────────────────────────────

  suno:doctor:
    desc: Run safe Suno authentication and API diagnostics.
    cmds:
      - poetry run mindcap doctor suno
    silent: false

  suno:auth:
    desc: >-
      Store Suno authentication credentials.
      Pipe your Clerk __client cookie or full Cookie header over stdin.
      Example: echo "<cookie-value>" | task suno:auth
    cmds:
      - poetry run mindcap auth suno --cookie-stdin
    silent: false

  suno:capture:
    desc: >-
      Capture a Suno workspace via the API strategy.
      Usage: task suno:capture -- "<workspace-url-or-id>"
      Examples:
        task suno:capture -- "https://suno.com/create?wid=04374a8f-a159-..."
        task suno:capture -- "04374a8f-a159-..."
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "Usage: task suno:capture -- \"<workspace-url-or-id>\""
          echo "Example: task suno:capture -- \"https://suno.com/create?wid=04374a8f-a159-...\""
          exit 1
        fi
        poetry run mindcap capture suno "{{.CLI_ARGS}}"
    silent: false

  suno:verify:
    desc: >-
      Verify the integrity of a captured Suno archive bundle.
      Usage: task suno:verify -- "<bundle-path>"
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "Usage: task suno:verify -- \"<bundle-path>\""
          echo "Tip:   run 'task paths' to locate your archive directory."
          exit 1
        fi
        poetry run mindcap verify "{{.CLI_ARGS}}"
    silent: false

  suno:inspect:
    desc: >-
      Inspect a captured Suno workspace archive bundle.
      Usage: task suno:inspect -- "<bundle-path>"
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "Usage: task suno:inspect -- \"<bundle-path>\""
          exit 1
        fi
        poetry run mindcap inspect suno "{{.CLI_ARGS}}"
    silent: false

  # ── DistroKid-specific tasks ────────────────────────────────────────────────

  distrokid:auth:
    desc: >-
      Authenticate the dedicated DistroKid browser profile with stable Chrome.
    cmds:
      - poetry run mindcap auth distrokid
    silent: false

  distrokid:doctor:
    desc: Run safe DistroKid authentication and browser diagnostics.
    cmds:
      - poetry run mindcap doctor distrokid
    silent: false

  distrokid:capture:
    desc: >-
      Capture a DistroKid library or release source via browser strategy.
      Usage: task distrokid:capture -- "<mymusic-url|album-url|album-uuid>"
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          printf '%s\n' "Usage: task distrokid:capture -- \"<mymusic-url|album-url|album-uuid>\""
          printf '%s\n' "Example: task distrokid:capture -- \"https://distrokid.com/mymusic/\""
          printf '%s\n' "Example: task distrokid:capture -- \"https://distrokid.com/dashboard/album/?albumuuid=642BAA93-568F-47A7-99558E4426A9D1D0\""
          exit 1
        fi
        poetry run mindcap capture distrokid "{{.CLI_ARGS}}" --strategy "browser"
    silent: false

  distrokid:capture-library:
    desc: >-
      Capture the authenticated DistroKid release library index.
    cmds:
      - poetry run mindcap capture distrokid "https://distrokid.com/mymusic/" --strategy "browser"
    silent: false

  distrokid:capture-release:
    desc: >-
      Capture a single DistroKid release by URL or album UUID.
      Usage: task distrokid:capture-release -- "<album-url|album-uuid>"
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          printf '%s\n' "Usage: task distrokid:capture-release -- \"<album-url|album-uuid>\""
          printf '%s\n' "Example: task distrokid:capture-release -- \"642BAA93-568F-47A7-99558E4426A9D1D0\""
          exit 1
        fi
        poetry run mindcap capture distrokid "{{.CLI_ARGS}}" --strategy "browser"
    silent: false

  distrokid:inspect:
    desc: >-
      Inspect a captured DistroKid archive bundle.
      Usage: task distrokid:inspect -- "<bundle-path>"
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          printf '%s\n' "Usage: task distrokid:inspect -- \"<bundle-path>\""
          exit 1
        fi
        poetry run mindcap inspect distrokid "{{.CLI_ARGS}}"
    silent: false

  distrokid:verify:
    desc: >-
      Verify the integrity of a captured DistroKid archive bundle.
      Usage: task distrokid:verify -- "<bundle-path>"
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          printf '%s\n' "Usage: task distrokid:verify -- \"<bundle-path>\""
          exit 1
        fi
        poetry run mindcap verify "{{.CLI_ARGS}}"
    silent: false

  # ── Sync tasks ──────────────────────────────────────────────────────────────

  suno:sync:
    desc: >-
      Discover and archive every Suno workspace in the authenticated account.
      Automatically resumes the latest unfinished run when unambiguous.
    cmds:
      - poetry run mindcap sync suno --resume
    silent: false

  suno:sync:resume:
    desc: >-
      Resume a specific Suno sync run by run ID.
      Usage: task suno:sync:resume -- "<run-id>"
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          printf '%s\n' "Usage: task suno:sync:resume -- \"<run-id>\""
          printf '%s\n' "Example: task suno:sync:resume -- \"suno-20260730T164500Z-abc123\""
          exit 1
        fi
        poetry run mindcap sync suno --resume --run-id "{{.CLI_ARGS}}"
    silent: false

  suno:sync:dry-run:
    desc: >-
      Plan a Suno account-wide sync without capturing any sources.
    cmds:
      - poetry run mindcap sync suno --dry-run
    silent: false

  distrokid:sync:
    desc: >-
      Discover and archive every DistroKid release in the authenticated library.
      Automatically resumes the latest unfinished run when unambiguous.
    cmds:
      - poetry run mindcap sync distrokid --resume
    silent: false

  distrokid:sync:resume:
    desc: >-
      Resume a specific DistroKid sync run by run ID.
      Usage: task distrokid:sync:resume -- "<run-id>"
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          printf '%s\n' "Usage: task distrokid:sync:resume -- \"<run-id>\""
          printf '%s\n' "Example: task distrokid:sync:resume -- \"distrokid-20260730T164500Z-abc123\""
          exit 1
        fi
        poetry run mindcap sync distrokid --resume --run-id "{{.CLI_ARGS}}"
    silent: false

  distrokid:sync:dry-run:
    desc: >-
      Plan a DistroKid library-wide sync without capturing any releases.
    cmds:
      - poetry run mindcap sync distrokid --dry-run
    silent: false

  sync:inspect:
    desc: >-
      Inspect a sync run state directory.
      Usage: task sync:inspect -- "<run-directory>"
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          printf '%s\n' "Usage: task sync:inspect -- \"<run-directory>\""
          exit 1
        fi
        poetry run mindcap inspect run "{{.CLI_ARGS}}"
    silent: false

  sync:verify:
    desc: >-
      Verify the integrity of a captured archive bundle.
      Usage: task sync:verify -- "<bundle-path>"
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          printf '%s\n' "Usage: task sync:verify -- \"<bundle-path>\""
          exit 1
        fi
        poetry run mindcap verify "{{.CLI_ARGS}}"
    silent: false
